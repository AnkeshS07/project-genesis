# Development full stack — Epic 00 / M10 (Architecture 1.1)
# Usage (from repo root):
#   docker compose -f docker/docker-compose.yml --env-file docker/.env.example up --build
#
# Service DNS names on the internal bridge: mongodb, redis, api, worker, web

name: project-genesis

services:
  mongodb:
    image: mongo:7
    container_name: project-genesis-mongodb
    restart: unless-stopped
    ports:
      - '${MONGO_HOST_PORT:-27017}:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - genesis
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: project-genesis-redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    networks:
      - genesis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: project-genesis-api:local
    container_name: project-genesis-api
    restart: unless-stopped
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: mongodb://mongodb:27017/project-genesis
      REDIS_URL: redis://redis:6379
    ports:
      - '${API_HOST_PORT:-3001}:3001'
    networks:
      - genesis
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: project-genesis-worker:local
    container_name: project-genesis-worker
    restart: unless-stopped
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongodb:27017/project-genesis
      REDIS_URL: redis://redis:6379
    networks:
      - genesis
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'node', '-e', "require('fs').accessSync('dist/worker.main.js'); process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    image: project-genesis-web:local
    container_name: project-genesis-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    networks:
      - genesis
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

networks:
  genesis:
    driver: bridge
    name: project-genesis-net

volumes:
  mongodb_data:
  redis_data:
