# CI — lint, typecheck, tests, Docker image verify (Epic 00 / M11)
#
# PR:   lint · typecheck → unit · api · integration · docker
# main: above → e2e (Chromium) · coverage artifact
#
# Gate: expensive jobs `needs` lint + typecheck (fail-fast).
# No deploy · no registry push · no cloud credentials.
# Future OIDC: add `id-token: write` only when a deploy job is introduced.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: read checkout; write only for Actions cache + artifacts.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    name: Unit tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Unit tests
        run: pnpm test:unit

  test-api:
    name: API tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: API tests
        run: pnpm test:api

  test-integration:
    name: Integration tests (optional)
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Secrets are injected as env (GitHub masks them). Do not echo / printenv.
      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_REDIS_URL: ${{ secrets.TEST_REDIS_URL }}

  docker:
    name: Docker image builds
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose (dev)
        run: docker compose -f docker/docker-compose.yml --env-file docker/.env.example config --quiet

      - name: Validate Compose (prod)
        run: docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.example config --quiet

      # API + Worker share scope=server (near-identical stages). Web uses scope=web.
      # cache-from/to type=gha reuses layers across workflow runs; within this job
      # Buildx also reuses the local builder cache between sequential builds.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: project-genesis-api:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: project-genesis-worker:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          load: true
          tags: project-genesis-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  test-e2e:
    name: E2E tests (Chromium)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test-unit, test-api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E (Chromium)
        run: pnpm test:e2e

      - name: Upload Playwright report (failure only)
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-cov:
    name: Coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Unit coverage
        run: pnpm test:cov

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            server/coverage/unit/
            apps/web/coverage/unit/
          if-no-files-found: warn
          retention-days: 14
